# Render Blueprint: New + > Blueprint > pick this repo.
services:
  - type: web
    name: latex-studio
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: AUTH_USER
        value: admin
      - key: AUTH_PASSWORD
        sync: false # Render asks you for this value when the Blueprint is created
    # Without a disk, projects are lost on every redeploy/restart. Disks need a paid
    # plan: change `plan` to starter and uncomment these lines to keep projects.
    # disk:
    #   name: projects
    #   mountPath: /data
    #   sizeGB: 1
    # (and add an env var:  - key: PROJECTS_DIR  value: /data/projects)
